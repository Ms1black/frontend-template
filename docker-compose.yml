name: frontend-template

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync
        - path: ./public
          target: /app/public
          action: sync
        - path: ./package.json
          target: /app/package.json
          action: rebuild

  storybook:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "6006:6006"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    command: pnpm storybook
    restart: unless-stopped
    develop:
      watch:
        - path: ./src
          target: /app/src
          action: sync
        - path: ./.storybook
          target: /app/.storybook
          action: sync

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=test
      - CI=true
    command: pnpm test
    profiles: [test]

  e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /app
    environment:
      - CI=true
      - PLAYWRIGHT_BASE_URL=http://app:3000
    command: node_modules/.bin/playwright test
    depends_on:
      app:
        condition: service_healthy
    profiles: [e2e]
